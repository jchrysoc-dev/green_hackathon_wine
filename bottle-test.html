<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LooVin bottle recognition</title><style>body{font:16px system-ui;max-width:620px;margin:auto;padding:20px;background:#fff8ed;color:#260b13}section{background:#fff;padding:18px;margin:16px 0;border:1px solid #e3c6c8}label,button{display:block;margin-top:12px}input{padding:10px;font-size:16px;width:100%;box-sizing:border-box}button{padding:12px 16px;background:#260b13;color:#fff;border:0;font-size:16px}button.secondary{background:white;color:#260b13;border:1px solid #260b13}small,#status{color:#68434f}.ok{color:#287342}.warn{color:#9a5b00}table{width:100%;margin-top:12px;border-collapse:collapse}td{padding:6px;border-bottom:1px solid #ddd}</style></head><body><h1>Bottle recognition test</h1><p>Runs locally in your browser. The first load downloads the model once; photos are not uploaded.</p><p id="status">Loading model…</p><section><h2>1. Teach bottles</h2><small>Use the exact IDs from wines.json, such as <b>stage-wine</b> and <b>reusable-match</b>.</small><input id="wine" placeholder="stage-wine"><input id="refs" type="file" accept="image/*" multiple><button id="add">Add reference photos</button><div id="list"></div></section><section><h2>2. Test a scan</h2><input id="scan" type="file" accept="image/*" capture="environment"><div id="out"></div></section><section><h2>3. Export</h2><label>Threshold <input id="threshold" value="0.85"></label><button class="secondary" id="export">Download bottle-embeddings.json</button></section><script type="module">import{AutoProcessor,CLIPVisionModelWithProjection,RawImage}from'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3';const MODEL='Xenova/clip-vit-base-patch32',MARGIN=.03;let processor,model,refs={};try{refs=JSON.parse(localStorage.getItem('loovin-refs')||'{}')}catch{};const $=id=>document.getElementById(id);function draw(){ $('list').innerHTML=Object.keys(refs).length?'<ul>'+Object.entries(refs).map(([id,v])=>`<li><b>${id}</b>: ${v.length} photo(s)</li>`).join('')+'</ul>':'<small>No reference photos yet.</small>'}async function init(){try{processor=await AutoProcessor.from_pretrained(MODEL);try{model=await CLIPVisionModelWithProjection.from_pretrained(MODEL,{dtype:'q8'})}catch{model=await CLIPVisionModelWithProjection.from_pretrained(MODEL)}$('status').textContent='Model ready.'}catch(e){$('status').textContent='Could not load model: '+e.message}draw()}async function embed(file){const image=await RawImage.fromBlob(file),inputs=await processor(image),out=await model(inputs);return Array.from(out.image_embeds.normalize().data)}const dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0);$('add').onclick=async()=>{const id=$('wine').value.trim().toLowerCase().replace(/\s+/g,'-'),files=[...$('refs').files];if(!id||!files.length)return alert('Enter a wine ID and choose photos.');if(!model)return alert('The model is still loading.');refs[id]=refs[id]||[];for(let i=0;i<files.length;i++){$('status').textContent=`Learning ${id}: ${i+1}/${files.length}`;refs[id].push(await embed(files[i]))}localStorage.setItem('loovin-refs',JSON.stringify(refs));$('refs').value='';$('status').textContent='Model ready.';draw()};$('scan').onchange=async()=>{const file=$('scan').files[0];if(!file)return;if(!Object.keys(refs).length)return alert('Add reference photos first.');$('out').innerHTML='<p>Analysing…</p>';const v=await embed(file),ranked=Object.entries(refs).map(([id,list])=>({id,score:Math.max(...list.map(r=>dot(v,r)))})).sort((a,b)=>b.score-a.score),top=ranked[0],second=ranked[1],ok=top.score>=parseFloat($('threshold').value||.85)&&(!second||top.score-second.score>=MARGIN);$('out').innerHTML=`<p class="${ok?'ok':'warn'}">${ok?'Recognised: '+top.id:'Not sure — choose from the top 3'}</p><table>${ranked.slice(0,3).map(r=>`<tr><td>${r.id}</td><td>${r.score.toFixed(3)}</td></tr>`).join('')}</table>`};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({model:MODEL,threshold:parseFloat($('threshold').value)||.85,margin:MARGIN,references:refs})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bottle-embeddings.json';a.click()};init()</script></body></html>
